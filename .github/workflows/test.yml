name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The m2 extras (anthropic, openai, scipy, opentelemetry, shapely…)
          # are imported lazily by the production code paths but eagerly by
          # several tests. Install everything so the suite runs as it does
          # locally.
          pip install -e ".[dev,m2]"

      - name: Run pytest
        env:
          # Stub envs so tests don't try real API calls. Each module that has
          # a stub respects these and uses the offline path. Without them the
          # wiring tests for Duplo + Orchestra would attempt to instantiate
          # an Anthropic client with no API key and fail at import time.
          BOB_USE_STUB_DUPLO: "1"
          BOB_USE_STUB_ORCHESTRA: "1"
          BOB_USE_STUB_VROOM: "1"
        run: pytest -q
