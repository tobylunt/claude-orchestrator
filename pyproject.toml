[project]
name = "claude-orchestrator"
version = "0.1.0"
description = "Automated feature orchestrator using the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.0",
    "tomli>=2.0;python_version<'3.11'",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
m2 = [
    "autogen-agentchat>=0.4",
    "scipy>=1.13",
    "pandera>=0.20",
    "hypothesis>=6.100",
    "papermill>=2.6",
    "nbformat>=5.10.4",
    "nbclient>=0.10.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.10",
    "anthropic>=0.40",
    "openai>=1.50",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

[project.scripts]
orchestrate = "claude_orchestrator.cli:cli_entry"
bob = "claude_orchestrator.bob.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
